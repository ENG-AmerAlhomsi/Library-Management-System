spring.application.name=library_management_system
spring.profiles.active=dev

# Logging configuration
logging.level.com.project.library_management_system.aspect=DEBUG
logging.level.org.springframework=ERROR

# Caching configuration
spring.cache.type=simple # Use in-memory cache (default)
spring.cache.cache-names=books,patrons # Predefine cache names
spring.cache.simple.time-to-live=600000 # 10 minutes (in milliseconds)